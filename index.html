<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Мем Бравл: Симулятор Слияния</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/playgama-loader.js"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/localization.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/analytics.js"></script>
    <script defer src="js/sdk.js"></script>
    <script defer src="js/game.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <div id="game-root">
        <canvas id="game-canvas" width="1280" height="720" aria-label="Game canvas"></canvas>
        <div id="dom-ui" aria-live="polite"></div>
        <div id="loading-screen">
            <div class="loading-card">
                <div class="loading-title" id="loading-title"></div>
                <div class="loading-text" id="loading-text"></div>
                <div class="loading-bar">
                    <div class="loading-bar-fill" id="loading-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
